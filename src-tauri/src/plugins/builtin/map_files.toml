id = "map-files"
name = "Map Files"
author = "Cultivator"
version = "1.0.0"
description = "Parse KML placemarks, GPX waypoints/routes/tracks and GeoJSON into layers for the Map workspace. Preserve geometry, properties and source references."
type = "maps"
target = "other"
mode = "path_regex"
path_regex = "(?i).*\\.(kml|gpx|geojson)$"
entry = "builtin:map-files"
function = "parse"
