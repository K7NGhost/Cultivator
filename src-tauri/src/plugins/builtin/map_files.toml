id = "map-files"
name = "Map Files"
author = "Cultivator"
version = "1.1.0"
description = "Parse KML placemarks and track logs (including gx:Track/MultiTrack), GPX waypoints/routes/tracks and GeoJSON into Map layers. Preserve locations with unknown elevation, timestamps, segments, properties and source references."
type = "maps"
target = "other"
mode = "path_regex"
path_regex = "(?i).*\\.(kml|gpx|geojson)$"
entry = "builtin:map-files"
function = "parse"
