id = "image-metadata"
name = "Image Metadata"
author = "Cultivator Team"
version = "1.0.0"
description = "Built-in Rust analyzer for image and video gallery metadata."
type = "other"
target = "other"
mode = "path_regex"
path_regex = "(?i).*\\.(jpg|jpeg|png|gif|bmp|webp|tif|tiff|heic|heif|avif|mp4|mov|m4v|avi|webm|mkv|3gp)$"
entry = "builtin:image-metadata"
function = "scan"
