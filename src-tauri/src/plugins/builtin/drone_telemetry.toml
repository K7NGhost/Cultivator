id = "drone-telemetry"
name = "Drone Telemetry"
author = "Cultivator"
version = "1.0.0"
description = "Decode supported DJI DAT V1/V3 flight logs with Cultivator's native parser. Save telemetry, GPS tracks, controller events and source hashes for the Drone workspace. Encrypted LOGH files are unsupported."
type = "journeys"
target = "other"
mode = "path_regex"
path_regex = "(?i).*\\.dat$"
entry = "builtin:drone-telemetry"
function = "parse"

[[options]]
id = "carveDat"
label = "Carve DAT logs from disk images"
description = "Scan the original decoded disk-image bytes for CRC-validated DAT headers, including logs absent from the filesystem index. Saves contiguous recovered fragments with image offsets. This scans the entire image; fragmented or overwritten logs may be incomplete."
type = "checkbox"
defaultValue = "false"
