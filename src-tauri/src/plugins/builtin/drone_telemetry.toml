id = "drone-telemetry"
name = "Drone Telemetry"
author = "Cultivator / Samara"
version = "1.0.0"
description = "Decode supported DJI DAT V1/V3 flight logs with Samara's native parser. Save telemetry, GPS tracks, controller events and source hashes for the Drone workspace. Encrypted LOGH files are unsupported."
type = "journeys"
target = "other"
mode = "path_regex"
path_regex = "(?i).*\\.dat$"
entry = "builtin:drone-telemetry"
function = "parse"
