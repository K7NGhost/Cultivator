id = "semantic-index"
name = "Semantic Index (AI)"
author = "Cultivator Team"
version = "1.0.0"
description = "Indexes messages and photo captions with the on-device BGE-M3 model so the Assistant can search by meaning (e.g. \"money\" finds \"sent 9,500 to the account\"). Run after your message parser and Media Tagging. Requires a one-time model download (~2.3 GB); everything stays on this machine."
type = "other"
target = "other"
mode = "path_regex"
path_regex = ".*"
entry = "builtin:semantic-index"
function = "run"
