id = "media-tagging"
name = "Media Tagging (AI)"
author = "Cultivator Team"
version = "1.0.0"
description = "Generates local, offline image captions and keyword tags using an on-device AI model. Run together with Image Metadata. Requires a one-time model download (~1.5 GB) on first use; captioning always runs on-device and never sends evidence off the machine."
type = "other"
target = "other"
mode = "path_regex"
path_regex = "(?i).*\\.(jpg|jpeg|png|gif|bmp|webp|tif|tiff|heic|heif|avif)$"
entry = "builtin:media-tagging"
function = "run"
