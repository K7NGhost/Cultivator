[package]
name = "cultivator"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "cultivator"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cultivator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["python-plugins"]
python-plugins = []

[dependencies]
cultivator-drone-dat = { path = "crates/drone-dat" }
csv = "1.3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ctor = "0.8.0"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
tauri-plugin-dialog = "2"
grep = "0.4.1"
globset = "0.4.18"
ignore = "0.4.26"
imagesize = "0.15.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "tiff", "bmp", "ico", "pnm", "qoi"] }
jpeg-decoder = { version = "0.3.2", default-features = false }
kamadak-exif = "0.6.1"
rayon = "1.12.0"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
regex = "1.12.4"
serde_json = "1.0.150"
quick-xml = "0.39.4"
sha2 = "0.10.9"
sha1 = "0.10.6"
md-5 = "0.10.6"
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio"] }
toml = "0.9.12"
# zip's default zlib-rs backend overflows its input counter on Windows for
# members larger than 4 GiB. Keep the supported formats and use flate2's Rust backend.
zip = { version = "8.6.0", default-features = false, features = ["aes-crypto", "bzip2", "deflate64", "deflate-flate2", "deflate-zopfli", "lzma", "ppmd", "time", "zstd", "xz"] }
tar = "0.4.44"
flate2 = "1.1.5"
crc32fast = "1.5"
tokio = { version = "1.52.3", features = ["full"] }
memmap2 = "0.9.9"
inodex = "0.1.2"

[target.'cfg(windows)'.dependencies]
libloading = "0.7.4"
windows = { version = "0.61.3", features = ["Win32_Graphics_Imaging", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_JobObjects", "Win32_Security"] }

[dev-dependencies]
cultivator-drone-dat = { path = "crates/drone-dat", features = ["test-fixtures"] }
tempfile = "3"

# Camera JPEG entropy decoding runs on every cold gallery visit in development.
[profile.dev.package.jpeg-decoder]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

# DAT packet validation, CSV generation and hashing must also be fast in tauri dev.
[profile.dev.package.cultivator-drone-dat]
opt-level = 3

[profile.dev.package.csv]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.memchr]
opt-level = 3

[profile.dev.package.csv-core]
opt-level = 3

[profile.dev.package.ryu]
opt-level = 3

[profile.dev.package.serde_json]
opt-level = 3

[profile.dev.package.inodex]
opt-level = 3

[workspace]
members = ["crates/drone-dat"]
default-members = [".", "crates/drone-dat"]
resolver = "2"
