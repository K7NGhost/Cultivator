[package]
name = "cultivator-drone-dat"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "../../src/drone/dat/mod.rs"

[features]
test-fixtures = []

[dependencies]
csv = "1.3"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
ryu = "1"
sha2 = "0.10.9"
memchr = "2"
inodex = "0.1.2"

[dev-dependencies]
tempfile = "3"
